[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-quality-intelligence"
version = "1.0.0"
description = "Agentic AI demo for manufacturing quality inspection (synthetic data only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Core (required for offline validation + tests)
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # API (also serves the HTML/CSS/JS frontend in frontend/)
    "fastapi>=0.109",
    "uvicorn[standard]>=0.25",
    # Relational persistence (SQLite by default via stdlib; no driver needed)
    "sqlalchemy>=2.0",
    # Vector store for SOP chunks (replaces pgvector)
    "chromadb>=0.4",
    # Agentic orchestration (optional; fallback works without)
    "langgraph>=0.1",
    "langchain-core>=0.1",
    # LLM provider (optional, Groq only)
    "groq>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
embeddings = ["sentence-transformers>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
